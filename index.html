<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- iOS standalone / Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Workout">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>My Workout</title>

<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --text: #0e1116;
    --muted: #4a5260;
    --border: #1c2230;
    --ring: #ffd400;
    --track: #c9cfdb;
    --knob: #ffffff;
    --shadow: 0 4px 14px rgba(0,0,0,.10);
    --gap: 14px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1116;
    --surface: #1a1f29;
    --text: #ffffff;
    --muted: #b8c0cc;
    --border: #e8ecf2;
    --ring: #ffd400;
    --track: #3a4252;
    --knob: #ffffff;
    --shadow: 0 4px 14px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding:
      calc(env(safe-area-inset-top) + 10px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 14px)
      calc(env(safe-area-inset-left) + 14px);
    transition: background-color .3s ease, color .3s ease;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: var(--gap);
    flex: 0 0 auto;
  }
  h1 {
    font-size: clamp(1.25rem, 4.5vw, 2rem);
    font-weight: 800;
    letter-spacing: -.01em;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 60px;
    min-width: 60px;
    padding: 0 6px;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  .track {
    position: relative;
    width: 64px;
    height: 36px;
    border-radius: 18px;
    background: var(--track);
    border: 2px solid var(--border);
    transition: background-color .25s ease;
  }
  .knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--knob);
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
    display: grid;
    place-items: center;
    font-size: 16px;
    line-height: 1;
    transition: transform .25s ease;
  }
  :root[data-theme="dark"] .knob { transform: translateX(28px); }
  :root[data-theme="dark"] .track { background: #4a6cf7; }
  .theme-toggle:focus-visible { outline: 4px solid var(--ring); outline-offset: 2px; border-radius: 12px; }

  /* ---------- Grid ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    gap: var(--gap);
    /* Portrait: 2 columns, last tile spans full width */
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: minmax(0, 1fr);
  }
  main .tile:last-child { grid-column: 1 / -1; }

  /* Landscape iPad: 3 on top, 2 below (6-column grid keeps them even) */
  @media (orientation: landscape) {
    main { grid-template-columns: repeat(6, 1fr); }
    main .tile { grid-column: span 2; }
    main .tile:nth-child(4),
    main .tile:nth-child(5) { grid-column: span 3; }
  }
  /* Landscape phone: one row of five tall tiles so photos stay large */
  @media (orientation: landscape) and (max-height: 500px) {
    main { grid-template-columns: repeat(5, 1fr); }
    main .tile,
    main .tile:nth-child(4),
    main .tile:nth-child(5) { grid-column: auto; }
  }
  /* Short landscape phones: tighter header and spacing */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --gap: 10px; }
    header { margin-bottom: 8px; }
    .theme-toggle { min-height: 44px; }
    .tile { padding: 8px; border-width: 3px; }
  }

  /* ---------- Tiles ---------- */
  .tile {
    --accent: #0a66d6;
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 60px;
    min-height: 60px;
    padding: 10px;
    gap: 8px;
    background: var(--surface);
    color: var(--text);
    border: 4px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    font: inherit;
    cursor: pointer;
    overflow: hidden;
    touch-action: manipulation;
    /* Fade back to default */
    transition:
      background-color .45s ease,
      border-color .45s ease,
      color .45s ease,
      transform .45s ease,
      box-shadow .45s ease;
  }
  /* Colored stripe helps tell buttons apart at a glance */
  .tile::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 8px;
    background: var(--accent);
  }

  .photo {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin-top: 6px;
    border-radius: 14px;
    overflow: hidden;
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    display: grid;
    place-items: center;
  }
  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .photo .fallback {
    display: none;
    font-size: clamp(3rem, 12vmin, 7rem);
    line-height: 1;
  }
  .photo.no-img img { display: none; }
  .photo.no-img .fallback { display: block; }

  .label {
    flex: 0 0 auto;
    font-size: clamp(1.15rem, 4.2vmin, 2.1rem);
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    padding: 2px 4px 4px;
  }

  /* Pressed: instant, vivid */
  .tile.pressed {
    transition: none;
    background: var(--accent);
    color: #ffffff;
    border-color: var(--ring);
    transform: scale(.96);
    box-shadow: 0 0 0 6px var(--ring), var(--shadow);
  }
  .tile.pressed .photo { outline: 4px solid #ffffff; outline-offset: -4px; }

  .tile:focus-visible { outline: 5px solid var(--ring); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tile.pressed { transform: none !important; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Pick your exercise</h1>
  <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Dark mode">
    <span aria-hidden="true" id="themeLabel">Light</span>
    <span class="track" aria-hidden="true"><span class="knob" id="knob">☀️</span></span>
  </button>
</header>

<main id="grid" aria-label="Exercise choices"></main>

<div class="sr-only" aria-live="assertive" id="announcer"></div>

  const RESET_DELAY_MS = 800;   // how long the highlight stays on
  const REPRESS_GUARD_MS = 350; // ignores accidental double taps

  /* ---------- Theme (follows device setting, not saved) ---------- */
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const knob = document.getElementById('knob');
  const themeLabel = document.getElementById('themeLabel');

  function setTheme(mode) {
    root.setAttribute('data-theme', mode);
    const dark = mode === 'dark';
    toggle.setAttribute('aria-checked', String(dark));
    knob.textContent = dark ? '🌙' : '☀️';
    themeLabel.textContent = dark ? 'Dark' : 'Light';
  }
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  setTheme(mq.matches ? 'dark' : 'light');
  toggle.addEventListener('click', () => {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Audio: Web Audio ping ---------- */
  // Lets sound play even when the iPhone ring/silent switch is on (Safari 16.4+)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}

  let ctx = null;
  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state !== 'running') ctx.resume();
    return ctx;
  }

  function ping() {
    const c = getCtx();
    if (!c) return;
    const t = c.currentTime;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1046.5, t);                    // C6
    osc.frequency.exponentialRampToValueAtTime(1568, t + 0.07); // up to G6
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t);
    osc.stop(t + 0.25);
  }

  /* ---------- Audio: voice clips with speech fallback ---------- */
  // Set to true only if you add recorded MP3s in an /audio folder
  const USE_RECORDINGS = false;

  const voices = {};
  let currentVoice = null;

  if (USE_RECORDINGS) EXERCISES.forEach(ex => {
    const a = new Audio();
    a.preload = 'auto';
    a.addEventListener('error', () => { ex.audioFailed = true; });
    a.src = ex.audio;
    voices[ex.id] = a;
  });

  /* Built-in voice: prefers Moira (Irish English) */
  const PREFERRED_VOICE = 'Moira';
  const PREFERRED_LANG = 'en-IE';
  let chosenVoice = null;

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const list = window.speechSynthesis.getVoices();
    if (!list.length) return;
    chosenVoice =
      list.find(v => v.name.toLowerCase().includes(PREFERRED_VOICE.toLowerCase())) ||
      list.find(v => (v.lang || '').replace('_', '-').toLowerCase() === PREFERRED_LANG.toLowerCase()) ||
      null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function speakFallback(ex) {
    if (!('speechSynthesis' in window)) return;
    const synth = window.speechSynthesis;
    if (!chosenVoice) pickVoice();
    if (synth.speaking || synth.pending) synth.cancel();
    synth.resume(); // clears a stuck "paused" state some browsers get into
    const u = new SpeechSynthesisUtterance(ex.say || ex.label);
    if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; }
    else { u.lang = PREFERRED_LANG; }
    u.rate = 0.9;
    u.pitch = 1;
    u.volume = 1;
    synth.speak(u);
  }

  function speak(ex) {
    if (currentVoice) { currentVoice.pause(); currentVoice.currentTime = 0; }

    const a = voices[ex.id];
    if (!USE_RECORDINGS || ex.audioFailed || !a) { speakFallback(ex); return; }

    currentVoice = a;
    a.currentTime = 0;
    const p = a.play(); // must run inside the tap for iOS
    if (p && p.catch) p.catch(() => speakFallback(ex));
  }

  /* ---------- Build buttons ---------- */
  const grid = document.getElementById('grid');
  const announcer = document.getElementById('announcer');

  EXERCISES.forEach(ex => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.type = 'button';
    btn.style.setProperty('--accent', ex.color);
    btn.setAttribute('aria-label', ex.label);

    const photo = document.createElement('div');
    photo.className = 'photo';

    const img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.draggable = false;
    img.addEventListener('error', () => photo.classList.add('no-img'));
    img.src = ex.img;

    const fb = document.createElement('span');
    fb.className = 'fallback';
    fb.setAttribute('aria-hidden', 'true');
    fb.textContent = ex.emoji;

    photo.append(img, fb);

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = ex.label;

    btn.append(photo, label);
    grid.appendChild(btn);

    let resetTimer = null;
    let lastPress = 0;
    let lastSpeak = 0;

    // Instant feedback: highlight + ping the moment a finger touches
    function feedback() {
      const now = Date.now();
      if (now - lastPress < REPRESS_GUARD_MS) return;
      lastPress = now;

      clearTimeout(resetTimer);
      btn.classList.remove('pressed');
      void btn.offsetWidth; // restart state cleanly on rapid re-press
      btn.classList.add('pressed');

      ping();
      announcer.textContent = ex.label;

      resetTimer = setTimeout(() => btn.classList.remove('pressed'), RESET_DELAY_MS);
    }

    // Voice: iPhone/iPad only allow speech when the finger lifts (the click)
    function say() {
      const now = Date.now();
      if (now - lastSpeak < REPRESS_GUARD_MS) return;
      lastSpeak = now;
      speak(ex);
    }

    btn.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      feedback();
    });
    btn.addEventListener('click', () => {
      feedback(); // covers keyboard / Switch Control, ignored if a touch just ran it
      say();
    });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  /* ---------- Guards ---------- */
  // Block pinch/gesture zoom on iOS
  document.addEventListener('gesturestart', e => e.preventDefault());
  // Wake audio on the very first touch anywhere
  document.addEventListener('touchstart', getCtx, { once: true, passive: true });
})();
</script>
</body>
</html>
